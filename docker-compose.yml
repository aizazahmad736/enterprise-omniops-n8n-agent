version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: omniops-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    depends_on:
      - mock-api

  mock-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniops-mock-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

volumes:
  n8n_data:
